<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ConnectPro Technologies</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f3f6fc;--card:#fff;--tx:#0b1a38;--mu:#64748b;--bd:#e2e8f4;--nv:#0a1b45;--bl:#2563eb;--bl2:#0ea5e9;--rd:#dc2626;--in:#f8fafd;--sh:0 1px 2px rgba(10,27,69,.05),0 10px 30px rgba(10,27,69,.06)}
:root[data-theme=dark]{--bg:#070f26;--card:#0e1a3a;--tx:#e8eefc;--mu:#8fa0c4;--bd:#1f2f5c;--nv:#050b1f;--in:#0a1530;--sh:0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;font:14.5px/1.5 'Plus Jakarta Sans',system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}.mu{color:var(--mu)}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}h2{font-size:16px;font-weight:700;margin:0}
svg{flex-shrink:0}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--in)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--bl);outline-offset:1px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mu);margin-bottom:4px}
.btn{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--bl),#1d4ed8);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;box-shadow:0 4px 14px rgba(37,99,235,.3)}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.s{padding:5px 11px;font-size:12.5px;border-radius:8px}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer;display:grid;place-items:center}
/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:radial-gradient(circle at 20% 15%,rgba(14,165,233,.35),transparent 45%),radial-gradient(circle at 85% 85%,rgba(37,99,235,.5),transparent 50%),#0a1b45;color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.hero h1{font-size:40px;line-height:1.1;max-width:440px}.hero p{color:#b6c5ea;max-width:380px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--bl),var(--bl2));display:grid;place-items:center;font-weight:800;color:#fff}
.lw{display:grid;place-items:center;padding:24px}
#lf{width:100%;max-width:360px}#lf .fld{margin-top:16px}
.err{color:var(--rd);font-size:13px;min-height:20px;margin-top:10px}
/* shell */
#app{display:flex;min-height:100vh}
aside{width:244px;background:linear-gradient(180deg,#0a1b45,#0b2a6b);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;flex-shrink:0;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-weight:800;font-size:16px}
aside button{display:flex;align-items:center;gap:11px;background:none;border:0;color:#aebde3;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600}
aside button:hover{background:rgba(255,255,255,.08);color:#fff}aside button.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 var(--bl2)}
.sp{flex:1}
.wrap{flex:1;min-width:0}
.top{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:14px 28px 0}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:6px 14px;font-weight:600;font-size:13px}
main{padding:14px 28px 40px;max-width:1280px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh)}
.fl{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:14px;margin-bottom:14px}
.fl>*{flex:1 1 150px;min-width:130px}.fl .sb{flex:2 1 220px;position:relative}.fl .sb svg{position:absolute;left:11px;top:11px;color:var(--mu)}.fl .sb input{padding-left:34px}
.fl .dr{margin:0;flex:1 1 130px}.fl .btn{flex:0 0 auto}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sum span{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:2px 12px;font-size:12.5px;font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);font-weight:700;cursor:pointer;user-select:none;background:var(--in)}
tr:last-child td{border-bottom:0}tbody tr:hover td{background:var(--in)}
th.a,td.a{text-align:right}
.pill{display:inline-block;border-radius:20px;padding:2px 11px;font-size:12px;font-weight:700;background:var(--bd)}
.pill.Paid{background:#d1fae5;color:#065f46}.pill.Overdue{background:#fee2e2;color:#991b1b}.pill.Partial{background:#fef3c7;color:#92400e}.pill.Unpaid{background:#e2e8f0;color:#334155}
.pg{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:14px}
.empty{padding:44px;text-align:center;color:var(--mu)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:18px;display:flex;gap:14px;align-items:center}
.stat i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-style:normal;background:linear-gradient(135deg,var(--bl),var(--bl2))}
.stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.grid2>.card{padding:20px}
.bar{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;margin-top:11px;font-size:13px}
.bar div{height:9px;border-radius:9px;background:var(--bd);overflow:hidden}.bar div i{display:block;height:100%;border-radius:9px}
.cols{display:flex;gap:14px;align-items:flex-end;height:150px;margin-top:16px}
.cols>div{flex:1;text-align:center;font-size:12px;color:var(--mu)}
.cols .b{display:flex;gap:4px;align-items:flex-end;height:120px;justify-content:center}
.cols .b i{width:40%;max-width:22px;border-radius:6px 6px 0 0;display:block;min-height:2px}
.lg{display:flex;gap:16px;font-size:12.5px;margin-top:8px}.lg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);width:min(600px,94vw);padding:24px;max-height:92vh;box-shadow:var(--sh)}
dialog::backdrop{background:rgba(5,11,29,.6)}
#df{display:grid;grid-template-columns:1fr 1fr;gap:14px}#df h2,#df .full,#df .foot{grid-column:1/-1}
.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
#toast{position:fixed;bottom:22px;right:22px;background:var(--nv);color:#fff;padding:11px 18px;border-radius:12px;z-index:20;box-shadow:var(--sh)}
/* motion + extras */
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes flt{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-26px) scale(1.06)}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
main>*{animation:up .5s both}main>*:nth-child(2){animation-delay:.06s}main>*:nth-child(3){animation-delay:.12s}main>*:nth-child(4){animation-delay:.18s}main>*:nth-child(5){animation-delay:.24s}
.stat{animation:up .55s both;transition:transform .25s,box-shadow .25s}.stat:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(37,99,235,.2)}
.stat:nth-child(2){animation-delay:.06s}.stat:nth-child(3){animation-delay:.12s}.stat:nth-child(4){animation-delay:.18s}.stat:nth-child(5){animation-delay:.24s}.stat:nth-child(6){animation-delay:.3s}
.stat i{box-shadow:0 8px 18px rgba(37,99,235,.28)}
.btn{transition:transform .15s,box-shadow .2s,background .2s}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(37,99,235,.35)}.btn.g:hover{box-shadow:0 6px 16px rgba(10,27,69,.12)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;pointer-events:none}
.ib{transition:transform .2s}.ib:hover{transform:rotate(18deg)}
aside button{transition:background .2s,color .2s,transform .2s}aside button:hover{transform:translateX(3px)}
tbody tr{animation:up .35s both}tbody tr:nth-child(2){animation-delay:.03s}tbody tr:nth-child(3){animation-delay:.06s}tbody tr:nth-child(4){animation-delay:.09s}tbody tr:nth-child(5){animation-delay:.12s}tbody tr:nth-child(n+6){animation-delay:.15s}
td .btn.s{padding:6px 9px}td .btn{vertical-align:middle}
dialog[open]{animation:pop .22s}
#toast{display:flex;gap:8px;align-items:center;animation:tin .3s}
.bar div i,.cols .b i{transition:width .9s cubic-bezier(.2,.8,.2,1),height .9s cubic-bezier(.2,.8,.2,1)}
.arc{transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.sk{height:18px;border-radius:8px;background:linear-gradient(90deg,var(--bd) 25%,var(--in) 50%,var(--bd) 75%);background-size:200% 100%;animation:shim 1.3s infinite;margin:14px 0}
.hero{position:relative;overflow:hidden}.hero>*:not(.blob){position:relative}
.blob{position:absolute;border-radius:50%;background:linear-gradient(135deg,var(--bl2),var(--bl));opacity:.28;animation:flt 9s ease-in-out infinite}
.ft{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:14px}.ft li{display:flex;gap:12px;align-items:center;color:#d3def7;animation:up .6s both}
.fi{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.logo{box-shadow:0 0 0 4px rgba(14,165,233,.18)}
.hh{display:flex;gap:14px;align-items:center}.hi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--bl),var(--bl2));box-shadow:0 8px 20px rgba(37,99,235,.3)}
.rings{display:flex;gap:24px;justify-content:space-around;flex-wrap:wrap;margin-top:14px}.ring{text-align:center}
.cmw{position:relative}.fl .cmw{flex:0 0 auto}.cm{position:absolute;right:0;top:46px;padding:8px 16px;z-index:6;min-width:180px;animation:pop .18s}
.cm label{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--tx);margin:8px 0;cursor:pointer}.cm input{width:auto}
.card .fld{margin-top:12px}
.empty svg{color:var(--bl);opacity:.6;margin-bottom:6px}
.pg select{width:auto;padding:6px 10px}
.pill.Active{background:#dbeafe;color:#1e40af}
.btn{position:relative;overflow:hidden}.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .6s linear;pointer-events:none}
@keyframes rp{to{transform:scale(2.6);opacity:0}}
@keyframes gshift{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes wig{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes drift{to{transform:translate(40px,-30px) scale(1.08)}}
@keyframes grow{from{width:0}}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}40%{transform:translate(calc(var(--x)*.6),var(--y)) rotate(calc(var(--r)*.5));opacity:1}100%{transform:translate(var(--x),380px) rotate(var(--r));opacity:0}}
.cf{position:fixed;top:62%;width:9px;height:14px;border-radius:2px;z-index:60;pointer-events:none;animation:cf 1.6s cubic-bezier(.2,.7,.3,1) forwards}
aside button:hover svg{animation:wig .5s}
#app:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(620px 420px at 14% 8%,rgba(37,99,235,.11),transparent),radial-gradient(520px 420px at 92% 82%,rgba(14,165,233,.11),transparent);animation:drift 16s ease-in-out infinite alternate}
.stat.tilt{transition:transform .08s}
.banner{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;background:linear-gradient(120deg,#0a1b45,#1d4ed8,#0ea5e9,#0a1b45);background-size:300% 300%;animation:gshift 14s ease infinite,up .5s both;color:#fff;border-radius:20px;padding:24px 28px;margin-bottom:18px;box-shadow:0 18px 40px rgba(37,99,235,.28);position:relative;overflow:hidden}
.banner:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-70px;top:-120px;background:rgba(255,255,255,.1)}
.banner h2{font-size:21px;font-weight:700;margin:10px 0 0;max-width:540px;line-height:1.35}
.bi{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;background:rgba(255,255,255,.16);padding:4px 12px;border-radius:20px}
.bc{display:flex;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.bch{background:rgba(255,255,255,.14);border-radius:14px;padding:12px 16px;min-width:130px}.bch b{display:block;font-size:20px;font-weight:800}.bch span{font-size:12px;color:#d5e1fb}
.tbar{height:7px;border-radius:7px;background:rgba(255,255,255,.25);margin-top:8px;overflow:hidden}.tbar i{display:block;height:100%;background:#fff;border-radius:7px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.pgw{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}.pgb{width:90px;height:8px;border-radius:8px;background:var(--bd);overflow:hidden}.pgb i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--bl),var(--bl2));animation:grow 1.1s cubic-bezier(.2,.8,.2,1)}
.li table input,.li table select{padding:6px 8px;min-width:64px}.li .ld{min-width:190px}.li .lq,.li .lc,.li .lp{min-width:84px}.li td{padding:6px 8px}
.liact{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
.lisum{display:flex;gap:18px;flex-wrap:wrap;font-weight:700;margin-top:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;cursor:pointer;margin:0;color:var(--tx);font-size:14px}
.opt input{width:auto;margin-top:4px}.opt small{display:block;color:var(--mu);font-weight:400;font-size:12.5px}.opt:has(input:checked){border-color:var(--bl);background:var(--in)}
.att{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.att-i{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--card);cursor:pointer;box-shadow:var(--sh);transition:transform .2s;animation:up .5s both}
.att-i:hover{transform:translateY(-3px)}
.att-i .ai{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--bd);color:var(--mu)}
.att-i.on .ai{background:#fee2e2;color:#b91c1c;animation:wig 1.2s 1}
.att-i b{display:block;font-size:20px;line-height:1.1}.att-i span.t{color:var(--mu);font-size:12.5px;display:block}.att-i em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:#b91c1c}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kv>div{background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}.kv span{font-size:12px;color:var(--mu);display:block}.kv b{font-size:15px}
.ct{max-height:30vh;overflow:auto;border:1px solid var(--bd);border-radius:12px}
#df h3{margin:6px 0 0;font-size:14px}
@media(prefers-reduced-motion:reduce){.cf{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:820px){
#login{grid-template-columns:1fr}.hero{display:none}
#app{flex-direction:column}
aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;width:100%;flex-direction:row;padding:6px;z-index:10;justify-content:flex-start;overflow-x:auto}aside button{flex-shrink:0}
aside button{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px}.brand,.sp{display:none}
main,.top{padding-left:14px;padding-right:14px}main{padding-bottom:90px}.grid2{grid-template-columns:1fr}#df{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section id="login">
  <div class="hero">
    <i class="blob" style="width:260px;height:260px;right:-70px;top:-60px"></i><i class="blob" style="width:160px;height:160px;left:8%;bottom:14%;animation-delay:-4s"></i><i class="blob" style="width:90px;height:90px;right:22%;bottom:30%;animation-delay:-2s"></i>
    <div class="brand"><span class="logo">CP</span>ConnectPro Technologies</div>
    <div><h1>Jobs, customers and invoices in one place.</h1><p>Track every job from first call to final payment, and see what has actually been paid.</p><ul class="ft" id="ft"></ul></div>
    <div class="mu" style="color:#8ea2d6">Secure sign-in for authorised staff only.</div>
  </div>
  <div class="lw">
    <form id="lf">
      <h1 style="font-size:28px">Welcome back</h1>
      <div class="mu">Sign in to continue</div>
      <div class="fld"><label for="em">Username</label><input id="em" type="text" required autocomplete="username" autocapitalize="none" spellcheck="false"></div>
      <div class="fld"><label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password"></div>
      <div class="err" id="le"></div>
      <button class="btn" style="width:100%;justify-content:center;margin-top:6px">Sign in</button>
    </form>
  </div>
</section>

<div id="app" class="hide">
  <aside id="nav"></aside>
  <div class="wrap">
    <div class="top"><span class="chip" id="who"></span><button class="ib" id="th" aria-label="Switch light or dark mode"></button></div>
    <main id="main"></main>
  </div>
</div>

<dialog id="dlg"><form id="df" method="dialog"></form></dialog>
<div id="toast" class="hide"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>

  S.sites = [...seen.values()].sort((a, b) => a.name.localeCompare(b.name));

  dl.innerHTML = S.sites.map(x => `<option value="${esc(x.name)}"></option>`).join('');

async function saveSite(name, quiet) {
  const n = (name || '').trim(); if (!n) return false;
  if ((S.sites || []).some(x => x.id && x.name.toLowerCase() === n.toLowerCase())) return true;
  if (S.sitesTable === false) { if (!quiet) toast('Run SQL 024_site_locations.sql in Supabase to keep a saved location list'); return false; }
  const {error} = await sb.from('site_locations').insert({name: n});
  if (error && !quiet && !/duplicate|unique/i.test(error.message)) toast('Location not saved: ' + error.message);
  await loadSites(); return !error;
}

/* ---------- Excel: template, export, import/update ---------- */
const hdr = f => f[2] === 'cust' ? 'Customer' : f[2] === 'job' ? 'Job No' : f[2] === 'proj' ? 'Project No' : f[2] === 'maint' ? 'Maintenance Ref' : f[1];
const xlHeads = m => (m.no ? [m.no[0]] : []).concat(m.f.map(hdr));
function xlRow(m, r) {
  const o = {};
  if (m.no) o[m.no[0]] = pad(m.no[2], r[m.no[1]]);
  m.f.forEach(f => { o[hdr(f)] = f[2] === 'cust' ? cname(r[f[0]]) : f[2] === 'job' ? jno(r[f[0]]) : f[2] === 'proj' ? pcode(r[f[0]]) : f[2] === 'maint' ? mcode(r[f[0]]) : r[f[0]] ?? ''; });
  return o;
}
function saveXlsx(sheets, name) {
  const wb = XLSX.utils.book_new();
  sheets.forEach(([n, rows, heads]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows, heads ? {header: heads} : undefined), n));
  XLSX.writeFile(wb, name);
}
function exportXlsx() {
  const m = M[S.view], rows = S.rows.filter(filt).map(r => xlRow(m, r));
  if (!rows.length) return toast('Nothing to export');
  saveXlsx([[m.label, rows, xlHeads(m)]], S.view + '-' + today() + '.xlsx'); toast('Exported ' + rows.length + ' rows. Edit and re-import to update.');
}
function template() {
  const m = M[S.view], ex = {};
  if (m.no) ex[m.no[0]] = '';
  m.f.forEach(f => { const t = f[2]; ex[hdr(f)] = t === 'cust' ? (S.cust[0] ? S.cust[0].name : 'EXAMPLE Customer') : t === 'job' ? (S.jobs[0] ? pad('J-', S.jobs[0].job_no) : 'J-0001')
    : t === 'proj' || t === 'maint' ? '' : t === 'date' ? today() : t === 'number' ? 1000 : t === 'status' ? S.statuses[0] : t.startsWith('select:') ? t.slice(7).split(',')[0] : 'EXAMPLE ' + f[1]; });
  const help = ['How to use this sheet', '1. Fill the Data sheet, one record per row. Rows that contain the word EXAMPLE are ignored.',
    m.no ? '2. To UPDATE an existing record keep its ' + m.no[0] + '. Leave it empty to add a new record.' : '2. A row with the same Name as an existing customer updates it. Otherwise a new customer is added.',
    '3. Dates as YYYY-MM-DD. Money as plain numbers.', '4. Customer names that do not exist yet are created automatically.',
    '5. Only the columns present in your sheet are updated.'].map(x => ({Instructions: x}));
  saveXlsx([['Data', [ex], xlHeads(m)], ['How to use', help]], S.view + '-template.xlsx');
}
async function importXlsx(file) {
  const m = M[S.view];
  let rows;
  try { const wb = XLSX.read(await file.arrayBuffer(), {type: 'array', cellDates: true}); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval: ''}); }
  catch (e) { return toast('Could not read this Excel file'); }
  rows = rows.map(r => Object.fromEntries(Object.entries(r).map(([k, v]) => [k.trim().toLowerCase(), v])))
    .filter(r => !Object.values(r).some(v => typeof v === 'string' && v.startsWith('EXAMPLE')) && Object.values(r).some(v => v !== ''));
  if (!rows.length) return toast('No data rows found');
  if (!confirm('Import ' + rows.length + ' rows into ' + m.label + '? Existing records with the same ' + (m.no ? m.no[0] : 'name') + ' will be updated.')) return;
  toast('Importing…');
  const {data: ex} = await sb.from(S.view).select('*').is('deleted_at', null);
  let add = 0, upd = 0; const bad = [];
  for (const [n, r] of rows.entries()) {
    try {
      const o = {};
      for (const f of m.f) {
        const h = hdr(f).toLowerCase(), t = f[2]; if (!(h in r)) continue;
        let v = r[h];
        if (t === 'cust') {
          v = String(v).trim();
          if (v) { let c = S.cust.find(x => x.name.toLowerCase() === v.toLowerCase());
            if (!c) { const {data: nc, error} = await sb.from('customers').insert({name: v}).select('id,name').single(); if (error) throw error; c = nc; S.cust.push(c); }
            v = c.id; } else v = null;
        } else if (t === 'job') {
          const num = parseInt(String(v).replace(/\D/g, ''), 10), jb = S.jobs.find(x => x.job_no === num);
          if (!jb) throw new Error('Job ' + v + ' not found'); v = jb.id;
        } else if (t === 'proj') {
          const sv = String(v).trim();
          if (!sv) v = null; else { const num = parseInt(sv.replace(/\D/g, ''), 10), pr = S.projects.find(x => x.project_no === num || x.name.toLowerCase() === sv.toLowerCase()); if (!pr) throw new Error('Project ' + sv + ' not found'); v = pr.id; }
        } else if (t === 'maint') {
          const sv = String(v).trim();
          if (!sv) v = null; else { const num = parseInt(sv.replace(/\D/g, ''), 10), mm = S.maint.find(x => x.ref_no === num); if (!mm) throw new Error('Maintenance ' + sv + ' not found'); v = mm.id; }
        } else if (t === 'date') v = v instanceof Date ? new Date(v.getTime() + 12 * 36e5).toISOString().slice(0, 10) : (String(v).trim() || null);
        else if (t === 'number') v = +v || 0;
        else v = String(v).trim() || null;
        o[f[0]] = v;
      }
      let e = null;
      if (m.no) { const num = parseInt(String(r[m.no[0].toLowerCase()] ?? '').replace(/\D/g, ''), 10); if (num) e = ex.find(x => x[m.no[1]] === num); }
      else e = ex.find(x => (x.name || '').toLowerCase() === String(o.name || '').toLowerCase());
      for (const f of m.f) if (f[3] && !(e ? (o[f[0]] === undefined || o[f[0]]) : o[f[0]])) throw new Error(f[1] + ' is required');
      if (S.view === 'invoices' && o.job_id) o.customer_id = S.jobs.find(x => x.id === o.job_id).customer_id;
      if (e) {
        m.f.forEach(f => { if ((f[2] === 'status' || f[2].startsWith('select:')) && o[f[0]] == null) delete o[f[0]]; });
        const {error} = await sb.from(S.view).update(o).eq('id', e.id); if (error) throw error; upd++;
      } else {
        m.f.forEach(f => { if (o[f[0]] == null) o[f[0]] = f[2] === 'number' ? (S.view === 'customers' ? null : 0) : f[2] === 'status' ? S.statuses[0]
          : f[2].startsWith('select:') ? (f[0] === 'priority' ? 'Normal' : f[2].slice(7).split(',')[0]) : /^((issue|received|quote|start|supplied)_date|next_due)$/.test(f[0]) ? today() : null; });
        const {error} = await sb.from(S.view).insert(o); if (error) throw error; add++;
      }
    } catch (err) { bad.push('Row ' + (n + 2) + ': ' + (err.message || err)); }
  }
  await reload(); list();
  alert('Import finished.\nAdded: ' + add + '\nUpdated: ' + upd + '\nSkipped with errors: ' + bad.length + (bad.length ? '\n\n' + bad.slice(0, 8).join('\n') : ''));
}

async function maintDone(id) {
  const r = S.rows.find(x => x.id === id), n = {Weekly: 7, Monthly: 1, Quarterly: 3, 'Half-yearly': 6, Yearly: 12}[r.frequency], o = {last_done: today()};
  if (!n) o.status = 'Completed';
  else { const d = new Date(); r.frequency === 'Weekly' ? d.setDate(d.getDate() + 7) : d.setMonth(d.getMonth() + n); o.next_due = d.toISOString().slice(0, 10); o.status = 'Assigned'; }
  const {error} = await sb.from('maintenance').update(o).eq('id', id);
  if (error) return toast('Failed: ' + error.message);
  toast(n ? 'Done. Next due ' + o.next_due : 'Task completed'); confetti(); list();
}
async function maintJob(id) {
  const r = S.rows.find(x => x.id === id);
  const {data, error} = await sb.from('jobs').insert({customer_id: r.customer_id, title: 'Maintenance: ' + r.title, description: [r.site, r.asset].filter(Boolean).join(' / ') || null,
    status: S.statuses[0], value: r.value || 0, labour_cost: r.labour_cost || 0, material_cost: r.material_cost || 0, transport_cost: r.transport_cost || 0, other_cost: r.other_cost || 0, priority: r.priority || 'Normal', received_date: today(), target_date: r.next_due, job_type: 'Maintenance', maintenance_id: r.id, notes: 'Created from maintenance task ' + pad('M-', r.ref_no)}).select('job_no').single();
  if (error) return toast('Failed: ' + error.message);
  await sb.rpc('sync_maintenance_job', {p_mid: r.id});   // copy the task's labour / material / transport lines to the new job (needs SQL 021)
  await reload(); toast('Job ' + pad('J-', data.job_no) + ' created. The task is now In progress.'); list();
}
// Builds the lines for a maintenance quotation / invoice: one heading per location, and under it that location's Labour, charges and Transport lines.
function buildMaintItems(ts, lis) {
  const order = {Labour: 0, Material: 1, Other: 2, Transport: 3}, bySite = new Map();
  ts.slice().sort((a, b) => String(a.site || '').localeCompare(String(b.site || '')) || a.ref_no - b.ref_no).forEach(t => {
    const sn = (t.site || '').trim() || 'No location', nm = t.title + (t.asset ? ' (' + t.asset + ')' : '');
    if (!bySite.has(sn)) bySite.set(sn, []);
    const mine = (lis || []).filter(l => l.parent_id === t.id && l.kind !== 'Expense' && l.kind !== 'Location');
    (mine.length ? mine.map(l => ({kind: l.kind, description: nm + ' - ' + l.description, quantity: l.quantity, unit: l.unit, unit_cost: l.unit_cost, unit_price: l.unit_price}))
      : [{kind: 'Other', description: nm, quantity: 1, unit: 'visit', unit_cost: +t.est_cost || 0, unit_price: +t.value || 0}]).forEach(x => bySite.get(sn).push(x));
  });
  const items = [];
  bySite.forEach((rows, sn) => { items.push({kind: 'Location', description: sn, quantity: 1, unit: 'loc', unit_cost: 0, unit_price: 0}); items.push(...rows.sort((a, b) => (order[a.kind] ?? 2) - (order[b.kind] ?? 2))); });
  return items;
}
async function maintDoc(ids, what) {
  const ts = ids.map(id => S.maint.find(x => x.id === id)).filter(Boolean);
  if (!ts.length) return toast('Select at least one maintenance task');
  const custs = [...new Set(ts.map(t => t.customer_id || ''))];
  if (custs.length > 1) return toast('Selected tasks belong to different customers. Select tasks of one customer for a single ' + what + '.');
  if (!custs[0]) return toast('The selected tasks have no customer. Edit them and choose a customer first.');
  const {data: lis} = await sb.from('line_items').select('*').eq('parent_type', 'maintenance').in('parent_id', ts.map(t => t.id)).order('sort');
  const items = buildMaintItems(ts, lis), notes = 'Maintenance: ' + ts.map(t => pad('M-', t.ref_no)).join(', ');
  S.msel = {}; go(what === 'invoice' ? 'invoices' : 'quotations');
  form(null, what === 'invoice' ? {customer_id: custs[0], items, notes} : {customer_id: custs[0], title: 'Maintenance quotation', items, notes});
}
const maintInvoice = ids => maintDoc(ids, 'invoice'), maintQuotation = ids => maintDoc(ids, 'quotation');
async function completeJob(id) {
  const {error} = await sb.from('jobs').update({status: 'Completed', completion_date: today()}).eq('id', id);
  if (error) return toast('Failed: ' + error.message);
  const {data: iv} = await sb.from('invoices').select('invoice_no,doc_no').eq('job_id', id).is('deleted_at', null).order('created_at', {ascending: false}).limit(1);
  await reload(); confetti();
  toast('Job completed.' + (iv && iv[0] ? ' Invoice ' + inn(iv[0]) + ' was created automatically. Edit or print it in Invoices.' : '')); list();
}
async function setQuote(id, st) {
  const {error} = await sb.from('quotations').update({status: st}).eq('id', id);
  if (error) return toast('Failed: ' + error.message);

function input(f, v) {
  const [k, l, t, req] = f, val = v ?? '';
  let h;
  if (t === 'textarea') h = `<textarea name="${k}" rows="3">${esc(val)}</textarea>`;
  else if (t === 'cust') h = `<select name="${k}"><option value="">None</option>${S.cust.map(c => `<option value="${c.id}"${c.id === val ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select>`;
  else if (t === 'job') h = `<select name="${k}" required><option value="">Select job number</option>${S.jobs.map(j => `<option value="${j.id}"${j.id === val ? ' selected' : ''}>${pad('J-', j.job_no)} - ${j.site ? esc(j.site) + ' | ' : ''}${esc(j.title)}</option>`).join('')}</select>`;
  else if (t === 'maint') h = `<select name="${k}"><option value="">Not linked</option>${S.maint.map(x => `<option value="${x.id}"${x.id === val ? ' selected' : ''}>${pad('M-', x.ref_no)} - ${esc(x.title)}</option>`).join('')}</select>`;
  else if (t === 'proj') h = `<select name="${k}"><option value="">No project</option>${S.projects.map(x => `<option value="${x.id}"${x.id === val ? ' selected' : ''}>${pad('P-', x.project_no)} - ${esc(x.name)}</option>`).join('')}</select>`;
  else if (t === 'status' || t.startsWith('select:')) {
    const o = t === 'status' ? (val && !S.statuses.includes(val) ? [...S.statuses, val] : S.statuses) : (val && !t.slice(7).split(',').includes(val) ? [...t.slice(7).split(','), val] : t.slice(7).split(','));
    h = `<select name="${k}">${o.map(x => `<option${x === val ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
  } else h = `<input name="${k}" type="${t}"${t === 'number' ? ' step="0.01" min="0"' + (k === 'progress' ? ' max="100"' : '') : ''} value="${esc(val)}"${req ? ' required' : ''}>`;
  return `<div class="fld${t === 'textarea' ? ' full' : ''}"><label>${l.replace('LKR', S.cur)}${req ? ' *' : ''}</label>${h}</div>`;
}
function dflt(f) {
  const t = f[2];
  return t === 'status' ? S.statuses[0] : t.startsWith('select:') ? (f[0] === 'priority' ? 'Normal' : t.slice(7).split(',')[0])
    : /^((issue|received|quote|start|supplied)_date|next_due)$/.test(f[0]) ? today() : f[0] === 'due_date' ? addDays(S.terms) : f[0] === 'target_date' ? addDays(S.dur) : f[0] === 'valid_until' ? addDays(S.qvalid) : '';
}
async function form(row, pre) {
  const m = M[S.view];
  const ptype = {quotations: 'quotation', jobs: 'job', invoices: 'invoice', maintenance: 'maintenance'}[S.view];
  let existing = (pre && pre.items) || [], supPrice = 0;
  if (ptype && row) {
    const [li, su] = await Promise.all([sb.from('line_items').select('*').eq('parent_type', ptype).eq('parent_id', row.id).order('sort'),
      ptype === 'job' ? sb.from('supplies').select('total_price').eq('job_id', row.id).is('deleted_at', null) : Promise.resolve({data: []})]);
    existing = li.data || []; supPrice = (su.data || []).reduce((a, x) => a + (+x.total_price || 0), 0);
  }
  const nm = n => $('#df [name=' + n + ']');
  $('#dlg').style.width = ''; $('#df').innerHTML = `<h2>${row ? 'Edit' : 'Add'} ${m.one}</h2>` + m.f.map(f => input(f, row ? row[f[0]] : pre && pre[f[0]] !== undefined ? pre[f[0]] : dflt(f))).join('')
    + `<div class="foot"><button type="button" class="btn g" id="cx">Cancel</button><button class="btn">Save ${m.one}</button></div>`;
  $('#cx').onclick = () => $('#dlg').close();
  if (['jobs','quotations','projects','maintenance'].includes(S.view)) {
    const vk = S.view === 'quotations' ? 'amount' : 'value', box = document.createElement('div');
    box.className = 'full card'; box.style.cssText = 'padding:12px 16px;display:flex;gap:20px;flex-wrap:wrap;font-weight:600';
    $('#df .foot').before(box);
    const calc = () => { const g = n => +($('#df [name=' + n + ']').value) || 0, c = g('labour_cost') + g('material_cost') + g('transport_cost') + g('other_cost') + (row && S.view === 'jobs' ? +row.supply_cost || 0 : 0), v = g(vk);
      box.innerHTML = `<span>Total cost ${money(c)}</span><span>Profit ${profit(v, c)}</span><span>Margin ${v ? ((v - c) / v * 100).toFixed(1) : 0}%</span>`; };
    $('#df').oninput = calc; calc();
  }
  if (S.view === 'jobs') {
    const jt = $('#df [name=job_type]'), stt = $('#df [name=status]'), hint = document.createElement('div');
    hint.className = 'full mu'; hint.style.fontSize = '13px'; jt.closest('.fld').after(hint);
    const upd = () => { hint.innerHTML = jt.value === 'Quotation' && !(row && row.quotation_id) ? ic('quote', 14) + ' A draft quotation will be created automatically in the Quotations tab.' : ''; };
    jt.onchange = () => { upd();
      if (jt.value === 'Quotation' && S.statuses.includes('Quotation') && !(row && row.quotation_id) && stt.value === S.statuses[0]) stt.value = 'Quotation';
      else if (jt.value !== 'Quotation' && stt.value === 'Quotation' && !(row && row.quotation_id)) stt.value = S.statuses[0]; };
    upd();
    const mf = $('#df [name=maintenance_id]'), mfld = mf.closest('.fld');
    const sync = () => { const on = jt.value === 'Maintenance'; mfld.style.display = on ? '' : 'none'; if (!on) mf.value = ''; const dl = nm('description').closest('.fld').querySelector('label'); if (dl) dl.textContent = on ? 'Complaint / maintenance description' : 'Description'; };
    const jt0 = jt.onchange; jt.onchange = () => { jt0(); sync(); };
    mf.onchange = () => { const t = S.maint.find(x => x.id === mf.value); if (!t) return;
      const set = (n, v) => { const e = $('#df [name=' + n + ']'); if (e && !e.value) e.value = v; };
      set('customer_id', t.customer_id || ''); set('title', 'Maintenance: ' + t.title); set('value', t.value || 0); };
    sync();
  }
  let ed = null;
  if (ptype) {
    const onEd = t => {
      const lock = (n, v) => { const e = nm(n); if (!e) return; e.readOnly = t.n > 0; if (t.n > 0) e.value = (Math.round(+v * 100) / 100).toFixed(2); };
      if (ptype === 'invoice') { const d = +((nm('discount') || {}).value) || 0, x = +((nm('tax_rate') || {}).value) || 0; lock('amount', (t.price - d) * (1 + x / 100)); }
      else { lock(ptype === 'quotation' ? 'amount' : 'value', t.price + (ptype === 'job' ? supPrice : 0)); lock('labour_cost', t.Labour); lock('material_cost', t.Material); lock('transport_cost', t.Transport); lock('other_cost', t.Other); }
      $('#df').dispatchEvent(new Event('input', {bubbles: true}));
    };
    ed = itemsEditor(existing, onEd, ptype === 'invoice' ? KINDS.filter(k => k !== 'Expense') : KINDS);
    const dsc = nm('description'), anchor = (dsc || nm('notes')).closest('.fld');
    if (ptype === 'maintenance') nm('value').closest('.fld').before(ed.el);   // line table sits above the value / cost fields

    ['discount', 'tax_rate'].forEach(n => { const e = nm(n); if (e) e.addEventListener('input', () => ed.update()); });

    pb.textContent = 'Pull all charges from the job (line by line)';
    pb.onclick = async () => { if (!js.value) return toast('Select a job first');

      if (!rs.length || (rs.length === 1 && rs[0].unit === 'job')) return toast('This job has no charge lines yet. Add Material / Labour / Transport lines on the job first.');
      if (ed.isEmpty() || confirm('Replace the current invoice lines with all ' + rs.length + ' charge lines of this job?')) { ed.setRows(rs); toast(rs.length + ' charge lines loaded'); } };

  if (si) siteField(si);
  if (cs && si) cs.addEventListener('change', () => { const c = S.cust.find(x => x.id === cs.value); if (c && c.address && !si.value) si.value = c.address; });
  $('#df').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData($('#df')), o = {};
    m.f.forEach(([k,, t]) => { const v = fd.get(k); o[k] = v === '' || v === null ? (t === 'number' && S.view !== 'customers' ? 0 : null) : t === 'number' ? +v : v; });
    const jb = S.view === 'invoices' ? S.jobs.find(x => x.id === o.job_id) : null;
    if (S.view === 'invoices') { if (jb) o.customer_id = jb.customer_id; else if (preCust) o.customer_id = preCust; else return toast('Select a job'); }
    if (S.view === 'jobs' && o.job_type !== 'Maintenance') o.maintenance_id = null;
    const save = () => row ? sb.from(S.view).update(o).eq('id', row.id) : sb.from(S.view).insert(o).select('id').single();
    let {data: saved, error} = await save();
    if (error && S.view === 'jobs' && /job_type|maintenance_id/.test(error.message)) { delete o.job_type; delete o.maintenance_id; ({data: saved, error} = await save()); if (!error) toast('Saved without job type or maintenance link. Run SQL 006 and 007 in Supabase.'); }
    if (error) return toast('Save failed: ' + error.message);
    if (ed) {
      const pid = row ? row.id : saved.id;
      const raw = ed.read(), keepOrder = raw.some(r => r.kind === 'Location'), rs = raw.sort((a, b) => (keepOrder ? 0 : krank(a.kind) - krank(b.kind)) || a.sort - b.sort).map((r, i) => ({...r, sort: i}));   // location headings keep the order the user set
      // Use the workflow RPC to preserve line IDs and synchronize quotation materials to Item Supply.
      const {error: e2} = await sb.rpc('save_line_items', {p_type: ptype, p_id: pid, p_items: rs});
      if (e2) return toast('Items not saved: ' + e2.message + (ptype === 'maintenance' ? ' (run SQL 021_maintenance_line_items.sql in Supabase)' : ' (run SQL 015_sync_engine.sql in Supabase)'));
    }
    if (o.site) await saveSite(o.site, true);
    const qmsg = S.view === 'jobs' && o.job_type === 'Quotation' && !(row && row.quotation_id);
    $('#dlg').close(); toast(qmsg ? 'Job saved. A draft quotation was added to the Quotations tab.' : row ? 'Saved' : 'Created');
    if (S.view === 'invoices' && o.amount > 0 && o.paid >= o.amount) confetti();
    await reload();
    list();
  };
  $('#dlg').showModal();
}
async function del(id) {
  if (!confirm('Delete this ' + M[S.view].one + '? It will be hidden but kept in the database.')) return;
  const {error} = await sb.from(S.view).update({deleted_at: new Date().toISOString()}).eq('id', id);
  if (error) return toast('Delete failed: ' + error.message);
  toast('Deleted'); await reload(); list();
}

    <div class="card" style="padding:20px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h2>Account</h2><span class="mu">Signed in as ${esc(S.user)}</span></div><button class="btn g" id="rc">Reset table column layout</button></div>`;
  let newLogo = S.hdr || '';
  $('#s12').onchange = e => { const f = e.target.files[0]; if (!f) return; const img = new Image();
    img.onload = () => { const k = Math.min(1, 1000 / img.width), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height); cx.drawImage(img, 0, 0, c.width, c.height); newLogo = c.toDataURL('image/jpeg', 0.85); $('#lgp').innerHTML = `<img src="${newLogo}" alt="Letterhead" style="max-width:100%">`; URL.revokeObjectURL(img.src); };
    img.src = URL.createObjectURL(f); };
  $('#s12r').onclick = () => { newLogo = ''; $('#lgp').innerHTML = `<img src="${DEFAULT_HDR}" alt="Letterhead" style="max-width:100%">`; };
  $('#sp').onclick = async () => {
    const v = {hdr: newLogo, qpre: $('#s13').value.trim() || 'C', ipre: $('#s14').value.trim() || 'I', qvalid: +$('#s15').value || 30, prepName: $('#s16').value.trim(), prepTitle: $('#s17').value.trim(), authName: $('#s18').value.trim(), authTitle: $('#s19').value.trim(), remark: $('#s20').value.trim(), addr: $('#s7').value.trim(), phone: $('#s8').value.trim(), email: $('#s9').value.trim(), bank: $('#s10').value.trim(), foot: $('#s11').value.trim(), co: $('#s1').value.trim() || 'ConnectPro', cur: $('#s2').value.trim().toUpperCase() || 'LKR', terms: +$('#s3').value || 0, dur: +$('#s4').value || 0, ps: +$('#s5').value || 15, target: +$('#s6').value || 0};
    const {error} = await sb.from('app_settings').upsert({key: 'prefs', value: v, updated_at: new Date().toISOString()});
    if (error) return toast('Save failed: ' + error.message);
    Object.assign(S, v); nav(); toast('Preferences saved');
  };
  $('#sv').onclick = async () => {
    const v = $('#ss').value.split('\n').map(x => x.trim()).filter(Boolean);
    if (!v.length) return toast('Add at least one status');
    const {error} = await sb.from('app_settings').upsert({key: 'job_statuses', value: v, updated_at: new Date().toISOString()});
    if (error) return toast('Save failed: ' + error.message);
    S.statuses = v; toast('Statuses saved');
  };
  $('#rc').onclick = () => { S.hid = {}; try { localStorage.removeItem('hid'); } catch (e) {} toast('Column layout reset'); };
}
</script>
</body>
